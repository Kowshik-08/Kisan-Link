# ====================================================================
# Render.com Blueprint for KisanLink
# One-click deployment for PostgreSQL Database + Node.js API Service
# ====================================================================

databases:
  - name: kisanlink-db
    databaseName: kisanlink
    user: kisanlink_user
    plan: free
    region: oregon

services:
  - type: web
    name: kisanlink-api
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build && npx prisma migrate deploy && npm run prisma:seed
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kisanlink-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://kisanlink-drab.vercel.app
      - key: CLIENT_URL
        value: https://kisanlink-drab.vercel.app
